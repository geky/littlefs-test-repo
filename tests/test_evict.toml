    }
    lfs3_file_write(&lfs3, &file3, wbuf3, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file3) => 0;

    // create enough files for mroot to split twice
    lfs3_size_t i = 0;
    while (lfs3.mtree.weight == 0) {
