[cases.test_evict_t_btree_gbmap]
defines.CHUNK = 'BLOCK_SIZE'
defines.SIZE = ['1*CHUNK', '3*CHUNK', '20*CHUNK']
defines.SYNC = [false, true]
if = 'GBMAP'
ifdef = 'LFS3_GBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write to our file
    //
    // we use a really annoying write pattern to try to fragment the gbmap
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    while (wsize < SIZE) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        lfs3_soff_t off = lfs3_file_seek(&lfs3, &file, -CHUNK, LFS3_SEEK_END);
        assert(off >= 0);
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
        wsize += CHUNK;
    }

    // get a block to evict
    lfs3_block_t victim = lfs3.gbmap.b.blocks[0];

    // try evicting
    lfs3_fs_mkbad(&lfs3, victim, LFS3_MKBAD_EVICT) => 0;

    // evicted block should no longer be in use
    assert(lfs3.gbmap.b.blocks[0] != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_tinfo tinfo;
        int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(tinfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // check we can still read the file
    lfs3_file_rewind(&lfs3, &file) => 0;
    prng = wprng;
    for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            TEST_PRNG(&prng);
        }
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[CHUNK];
        lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
        assert(memcmp(rbuf, wbuf, CHUNK) == 0);
    }

    // try creating a second file to make sure the gbmap wasn't
    // corrupted
    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    for (lfs3_off_t i = 0; i < wsize/2; i += CHUNK) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file2, wbuf, CHUNK) => CHUNK;
    }
    lfs3_file_sync(&lfs3, &file2) => 0;

    // check we can still read the files
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_file_close(&lfs3, &file2) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
            lfs3_file_open(&lfs3, &file2, "octopus", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                TEST_PRNG(&prng);
            }
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }

        lfs3_file_rewind(&lfs3, &file2) => 0;
        for (lfs3_off_t i = 0; i < wsize/2; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file2, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_file_close(&lfs3, &file2) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

