[cases.test_evict_t_mdir_mroot_chain]
defines.SIZE = 'FCACHE_SIZE/2'
defines.SIBLING = [0, 1]
# force early relocations
defines.BLOCK_RECYCLES = 0
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mroot until it's not the mrootanchor
    //
    // we can't evict the mrootanchor
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    while (file.h.mdir.r.blocks[0] == 0
            || file.h.mdir.r.blocks[0] == 1) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // I'm too lazy to do this correctly, so just spam evictions until
    // we extend again
    lfs3_block_t victim = 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t count = lfs3_fs_usage(&lfs3);
        assert(count >= 0);
        if (count >= 6) {
            assert(count == 6 || count == 7); // maybe gbmap
            break;
        }

        // get a block to evict
        victim = file.h.mdir.r.blocks[SIBLING];

        // try evicting
        lfs3_fs_mkbad(&lfs3, victim, LFS3_MKBAD_EVICT) => 0;

        // evicted block should no longer be in use
        assert(file.h.mdir.r.blocks[0] != victim);
        assert(file.h.mdir.r.blocks[1] != victim);
    }

    // now we want to evict the mdir in our mroot chain, that is neither
    // the active mroot, nor the mrootanchor
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_tinfo tinfo;
        int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        if (i == 2 + SIBLING) {
            victim = tinfo.block;
            break;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;
    
    // try evicting
    lfs3_fs_mkbad(&lfs3, victim, LFS3_MKBAD_EVICT) => 0;

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_tinfo tinfo;
        int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(tinfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_evict_t_mdir_mroot_split]
defines.SIZE = 'FCACHE_SIZE/2'
defines.SIBLING = [0, 1, 2, 3]
# force early relocations
defines.BLOCK_RECYCLES = 0
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create two files
    lfs3_file_t file1;
    lfs3_file_open(&lfs3, &file1, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf1[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file1) => 0;

    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf2[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file2) => 0;

    // write to our mroot until it's not the mrootanchor
    //
    // we can't evict the mrootanchor
    while (file1.h.mdir.r.blocks[0] == 0
            || file1.h.mdir.r.blocks[0] == 1) {
        lfs3_file_rewind(&lfs3, &file1) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file1) => 0;
    }

    // create enough files to both compact and split
    lfs3_size_t i = 0;
    while (true) {
        // we should not have split yet
        assert(lfs3.mtree.weight == 0);
        // we need internals to check this
        lfs3_ssize_t estimate = lfs3_mdir_estimate__(&lfs3,
                &file1.h.mdir, -1, -1,
                NULL);
        assert(estimate >= 0);
        if ((file1.h.mdir.r.eoff & 0x7fffffff) > GC_COMPACTMETA_THRESH
                && estimate > BLOCK_SIZE/2) {
            break;
        }

        char name[256];
        sprintf(name, "medusaaaaaaaaaaaaaaaa%03x", i);
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
        lfs3_file_close(&lfs3, &file) => 0;
        i += 1;
    }

    // get a block to evict
    lfs3_block_t victim = (SIBLING < 2)
            ? file1.h.mdir.r.blocks[SIBLING % 2]
            : file2.h.mdir.r.blocks[SIBLING % 2];

    // try evicting
    lfs3_fs_mkbad(&lfs3, victim, LFS3_MKBAD_EVICT) => 0;

    // evicted block should no longer be in use
    assert(file1.h.mdir.r.blocks[0] != victim);
    assert(file1.h.mdir.r.blocks[1] != victim);
    assert(file2.h.mdir.r.blocks[0] != victim);
    assert(file2.h.mdir.r.blocks[1] != victim);
    
    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_tinfo tinfo;
        int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(tinfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // check we can still read the files
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file1) => 0;
            lfs3_file_close(&lfs3, &file2) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file1, "jellyfish", LFS3_O_RDONLY) => 0;
            lfs3_file_open(&lfs3, &file2, "octopus", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file1) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file1, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf1, SIZE) == 0);

        lfs3_file_rewind(&lfs3, &file2) => 0;
        lfs3_file_read(&lfs3, &file2, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf2, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file1) => 0;
    lfs3_file_close(&lfs3, &file2) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

