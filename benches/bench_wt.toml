# High-level write-throughput benchmarks
after = ['bench_file', 'bench_dir']

# these are common and can be overridden suite-wide
#
# note for bench_*_many, file size defaults to CHUNK, and SIZE = sum of
# all files
#
defines.SIZE = '1024*1024' # 1 MiB
defines.CHUNK = 64
defines.SEED = 42

# simulated time, in nanoseconds, to run the bench
defines.SIM_TIME = '60ULL*60ULL*1000ULL*1000ULL*1000ULL' # 1 hour
# simulation size in bytes
defines.SIM_SIZE = 0

# set this to true to skip bench warmup
defines.SKIP_WARMUP = false

# optionally create a bunch of static files
defines.STATIC_COUNT = 0
defines.STATIC_SIZE = 'BLOCK_SIZE'
defines.STATIC_COMPACT = false

# include common bench helpers
code = '''
    #include "benches/bench_helpers.h"
'''


# sequential write throughput
[cases.bench_wt_seq]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_MKCONSISTENT, CFG) => 0;
    if (!SKIP_WARMUP) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_warmup(&lfs3);
        if (err) {
            LFS3_ERROR("Bench warmup failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    if (STATIC_COUNT) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_populate(&lfs3,
                STATIC_COUNT, STATIC_SIZE, STATIC_COMPACT);
        if (err) {
            LFS3_ERROR("Bench populate failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    uint32_t prng = SEED;
    uint8_t *wbuf = malloc(CHUNK);

    // reset our timer
    BENCH_SIMRESET();

    // open a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "bench_seq",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_off_t size = 0;
    uint64_t written = 0;
    // ok, one of these needs to be non-zero
    LFS3_ASSERT(SIM_TIME > 0 || SIM_SIZE > 0);
    while ((SIM_SIZE && written < (uint64_t)SIM_SIZE)
            || (SIM_TIME && BENCH_SIMTIME() < SIM_TIME)) {
        BENCH_START("write");
        // arguably we should just rewind and continue writing to the
        // front of the file when we hit the end, but this overly
        // penalizes littlefs2, so instead we truncate
        if (size >= SIZE) {
            lfs3_file_rewind(&lfs3, &file) => 0;
            lfs3_file_truncate(&lfs3, &file, 0) => 0;
            size = 0;
        }

        // write to the file
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (BENCH_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;

        size += CHUNK;
        written += CHUNK;
        BENCH_STOP("write", written);
    }
    lfs3_file_close(&lfs3, &file) => 0;

    // report the total stack/heap usage after the benchmark
    #ifdef BENCH_STACK
    BENCH_RESULT("stack", written, BENCH_STACK_WATERMARK());
    BENCH_RESULT("ctx", written, BENCH_STACK_CURRENT());
    #endif
    #ifdef BENCH_HEAP
    BENCH_RESULT("heap", written, BENCH_HEAP_WATERMARK());
    BENCH_RESULT("buf", written, CHUNK + BUF_WATERMARK);
    #endif

    // find the total disk usage after the benchmark
    //
    // note this is garbage because of the above truncates!
    struct bench_helpers_usage usage;
    bench_helpers_usage(&lfs3, &usage) => 0;
    BENCH_RESULT("usage", written, usage.usage);
    BENCH_RESULT("mdir", written, usage.mdir);
    BENCH_RESULT("btree", written, usage.btree);
    BENCH_RESULT("data", written, usage.data);

    lfs3_unmount(&lfs3) => 0;
    free(wbuf);
'''

# random write throughput
[cases.bench_wt_random]
defines.GRANULAR = false
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_MKCONSISTENT, CFG) => 0;
    if (!SKIP_WARMUP) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_warmup(&lfs3);
        if (err) {
            LFS3_ERROR("Bench warmup failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    if (STATIC_COUNT) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_populate(&lfs3,
                STATIC_COUNT, STATIC_SIZE, STATIC_COMPACT);
        if (err) {
            LFS3_ERROR("Bench populate failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    uint32_t prng = SEED;
    uint8_t *wbuf = malloc(CHUNK);

    // reset our timer
    BENCH_SIMRESET();

    // open a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "bench_random",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL
                | ((GRANULAR) ? LFS3_O_GRANULAR : 0)) => 0;
    lfs3_off_t size = 0;
    uint64_t written = 0;
    // ok, one of these needs to be non-zero
    LFS3_ASSERT(SIM_TIME > 0 || SIM_SIZE > 0);
    while ((SIM_SIZE && written < (uint64_t)SIM_SIZE)
            || (SIM_TIME && BENCH_SIMTIME() < SIM_TIME)) {
        BENCH_START("write");
        // seek to a random location
        lfs3_off_t pos = BENCH_PRNG(&prng) % SIZE;
        lfs3_file_seek(&lfs3, &file, pos, LFS3_SEEK_SET) => pos;

        // write to the file
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (BENCH_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;

        size = lfs3_max(size, pos + CHUNK);
        written += CHUNK;
        BENCH_STOP("write", written);
    }
    lfs3_file_close(&lfs3, &file) => 0;

    // report the total stack/heap usage after the benchmark
    #ifdef BENCH_STACK
    BENCH_RESULT("stack", written, BENCH_STACK_WATERMARK());
    BENCH_RESULT("ctx", written, BENCH_STACK_CURRENT());
    #endif
    #ifdef BENCH_HEAP
    BENCH_RESULT("heap", written, BENCH_HEAP_WATERMARK());
    BENCH_RESULT("buf", written, CHUNK + BUF_WATERMARK);
    #endif

    // find the total disk usage after the benchmark
    struct bench_helpers_usage usage;
    bench_helpers_usage(&lfs3, &usage) => 0;
    BENCH_RESULT("usage", written, usage.usage);
    BENCH_RESULT("mdir", written, usage.mdir);
    BENCH_RESULT("btree", written, usage.btree);
    BENCH_RESULT("data", written, usage.data);

    lfs3_unmount(&lfs3) => 0;
    free(wbuf);
'''

# logging write throughput
#
# two big differences from seq:
# 1. fruncate/rotations instead of rewind+truncate
# 2. sync called on every write
[cases.bench_wt_logging]
defines.FRUNCATE = true
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_MKCONSISTENT, CFG) => 0;
    if (!SKIP_WARMUP) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_warmup(&lfs3);
        if (err) {
            LFS3_ERROR("Bench warmup failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    if (STATIC_COUNT) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_populate(&lfs3,
                STATIC_COUNT, STATIC_SIZE, STATIC_COMPACT);
        if (err) {
            LFS3_ERROR("Bench populate failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    uint32_t prng = SEED;
    uint8_t *wbuf = malloc(CHUNK);

    // reset our timer
    BENCH_SIMRESET();

    // open a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "bench_log",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL | LFS3_O_APPEND) => 0;
    uint64_t written = 0;
    // ok, one of these needs to be non-zero
    LFS3_ASSERT(SIM_TIME > 0 || SIM_SIZE > 0);
    while ((SIM_SIZE && written < (uint64_t)SIM_SIZE)
            || (SIM_TIME && BENCH_SIMTIME() < SIM_TIME)) {
        BENCH_START("write");
        // append to log
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (BENCH_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;

        // sync
        lfs3_file_sync(&lfs3, &file) => 0;

        // fruncate or rotate if full
        lfs3_soff_t size = lfs3_file_size(&lfs3, &file);
        assert(size >= 0);
        if (FRUNCATE) {
            if (size > SIZE) {
                lfs3_file_fruncate(&lfs3, &file, SIZE) => 0;
            }
        } else {
            if (size >= SIZE) {
                lfs3_file_close(&lfs3, &file) => 0;
                lfs3_rename(&lfs3, "bench_log", "bench_log.1") => 0;
                lfs3_file_open(&lfs3, &file, "bench_log",
                        LFS3_O_WRONLY
                            | LFS3_O_CREAT
                            | LFS3_O_EXCL
                            | LFS3_O_APPEND) => 0;
            }
        }

        written += CHUNK;
        BENCH_STOP("write", written);
    }
    lfs3_file_close(&lfs3, &file) => 0;

    // report the total stack/heap usage after the benchmark
    #ifdef BENCH_STACK
    BENCH_RESULT("stack", written, BENCH_STACK_WATERMARK());
    BENCH_RESULT("ctx", written, BENCH_STACK_CURRENT());
    #endif
    #ifdef BENCH_HEAP
    BENCH_RESULT("heap", written, BENCH_HEAP_WATERMARK());
    BENCH_RESULT("buf", written, CHUNK + BUF_WATERMARK);
    #endif

    // find the total disk usage after the benchmark
    struct bench_helpers_usage usage;
    bench_helpers_usage(&lfs3, &usage) => 0;
    BENCH_RESULT("usage", written, usage.usage);
    BENCH_RESULT("mdir", written, usage.mdir);
    BENCH_RESULT("btree", written, usage.btree);
    BENCH_RESULT("data", written, usage.data);

    lfs3_unmount(&lfs3) => 0;
    free(wbuf);
'''

# many small file write throughput
[cases.bench_wt_many]
defines.SET = true
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_MKCONSISTENT, CFG) => 0;
    if (!SKIP_WARMUP) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_warmup(&lfs3);
        if (err) {
            LFS3_ERROR("Bench warmup failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    if (STATIC_COUNT) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        int err = bench_helpers_populate(&lfs3,
                STATIC_COUNT, STATIC_SIZE, STATIC_COMPACT);
        if (err) {
            LFS3_ERROR("Bench populate failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    uint32_t prng = SEED;
    uint8_t *wbuf = malloc(CHUNK);

    // reset our timer
    BENCH_SIMRESET();

    uint64_t written = 0;
    // ok, one of these needs to be non-zero
    LFS3_ASSERT(SIM_TIME > 0 || SIM_SIZE > 0);
    while ((SIM_SIZE && written < (uint64_t)SIM_SIZE)
            || (SIM_TIME && BENCH_SIMTIME() < SIM_TIME)) {
        BENCH_START("write");
        // choose a random filename
        lfs3_off_t pos = BENCH_PRNG(&prng) % ((SIZE+(CHUNK-1))/CHUNK);
        char name[6+8+1];
        sprintf(name, "bench_%08x", pos);
        memset(wbuf, 'a'+(BENCH_PRNG(&prng) % 26), CHUNK);

        // create the file
        //
        // note file == CHUNK here, the sum of all files should add up
        // roughly to the benchmark SIZE
        if (SET) {
            lfs3_set(&lfs3, name, wbuf, CHUNK) => 0;
        } else {
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
            lfs3_file_close(&lfs3, &file) => 0;
        }

        written += CHUNK;
        BENCH_STOP("write", written);
    }

    // report the total stack/heap usage after the benchmark
    #ifdef BENCH_STACK
    BENCH_RESULT("stack", written, BENCH_STACK_WATERMARK());
    BENCH_RESULT("ctx", written, BENCH_STACK_CURRENT());
    #endif
    #ifdef BENCH_HEAP
    BENCH_RESULT("heap", written, BENCH_HEAP_WATERMARK());
    BENCH_RESULT("buf", written,
            // bit of a hack, but lfs3_set doesn't need to allocate a
            // file-cache
            CHUNK + BUF_WATERMARK
                - ((SET) ? FCACHE_SIZE : 0));
    #endif

    // find the total disk usage after the benchmark
    struct bench_helpers_usage usage;
    bench_helpers_usage(&lfs3, &usage) => 0;
    BENCH_RESULT("usage", written, usage.usage);
    BENCH_RESULT("mdir", written, usage.mdir);
    BENCH_RESULT("btree", written, usage.btree);
    BENCH_RESULT("data", written, usage.data);

    lfs3_unmount(&lfs3) => 0;
    free(wbuf);
'''

